  <g transform="translate(72 548)">
    <rect width="226" height="42" rx="21" fill="#fff" stroke="#CFD5F5"/>
    <circle cx="24" cy="21" r="8" fill="#0086FF"/>
    <text x="43" y="28" fill="#3E4661" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">CNCF Sandbox Project</text>
  </g>
  <text x="1128" y="579" text-anchor="end" fill="#6E748A" font-family="Inter, Arial, sans-serif" font-size="20">higress.ai</text>
