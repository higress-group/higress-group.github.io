    <circle cx="73" cy="69" r="33" fill="#fff" opacity="0.16"/>
    <path d="M58 55v28M88 55v28M58 69h30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="122" y="78" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Higress</text>
    <text x="42" y="128" fill="#EDEEFFFF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">AI Gateway</text>
    <text x="42" y="153" fill="#EDEEFFFF" font-family="Inter, Arial, sans-serif" font-size="16">Secure · Govern · Observe</text>
  </g>

  <g filter="url(#soft-shadow)">
    <g transform="translate(930 296)">
      <rect width="198" height="72" rx="20" fill="#fff" stroke="#DDE1F7"/>
      <circle cx="38" cy="36" r="16" fill="#ECF0FF"/>
      <path d="M31 31h14v10H31zM35 45h6" fill="none" stroke="#4D64F4" stroke-width="3" stroke-linejoin="round"/>
      <text x="67" y="44" fill="#30364E" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Models</text>
    </g>
    <g transform="translate(930 388)">
      <rect width="198" height="72" rx="20" fill="#fff" stroke="#DDE1F7"/>
      <circle cx="38" cy="36" r="16" fill="#F0ECFF"/>
